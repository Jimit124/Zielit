name: IndexNow ping

# Tells Bing (and other IndexNow search engines, which share submissions)
# about every page in sitemap.xml whenever the site changes.
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        env:
          KEY: 9896cdb3f1b344d6add9642c9f8a4e31
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          key = os.environ["KEY"]
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())
          body = json.dumps({
              "host": "zielit.com",
              "key": key,
              "keyLocation": f"https://zielit.com/{key}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req) as r:
              print("IndexNow response:", r.status, "for", len(urls), "URLs")
          PY
